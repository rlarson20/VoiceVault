[workspace]
members = [
    "crates/vv-core",
    "crates/vv-vault",
    "crates/vv-capture",
    "crates/vv-stt",
    "crates/vv-trigger",
    "crates/vv-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["RJ Larson"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
vv-core = { path = "crates/vv-core" }
vv-vault = { path = "crates/vv-vault" }
vv-capture = { path = "crates/vv-capture" }
vv-stt = { path = "crates/vv-stt" }
vv-trigger = { path = "crates/vv-trigger" }
