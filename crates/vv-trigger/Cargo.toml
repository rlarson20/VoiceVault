[package]
name = "vv-trigger"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.8", optional = true }
vv-core = { workspace = true }

[dependencies.rdev]
version = "0.5"
optional = true

[dependencies.tokio]
workspace = true
optional = true

[dependencies.tracing]
workspace = true
optional = true

[dependencies.thiserror]
workspace = true
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[features]
default = ["push_to_talk"]
push_to_talk = ["tokio", "tracing", "thiserror"]
global_hotkey = ["tokio", "tracing", "thiserror", "rdev"]
http_endpoint = ["tokio", "tracing", "thiserror", "axum", "serde", "serde_json"]
unix_socket = ["tokio", "tracing", "thiserror", "serde", "serde_json"]
voice_activity = ["tokio", "tracing", "thiserror"]
