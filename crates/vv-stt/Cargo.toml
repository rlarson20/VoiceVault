[package]
name = "vv-stt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Internal crates
vv-core = { workspace = true }

# Candle ML framework
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"

# Tokenization
tokenizers = "0.20"

# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
hf-hub = { version = "0.5.0", features = ["tokio"] }
byteorder = "1.5.0"
serde_json = "1.0.149"

[features]
metal = ["candle-core/metal", "candle-transformers/metal", "candle-nn/metal"]

[dev-dependencies]
wav = "1.0.1"

[build-dependencies]
# Built-in data files are included via include_bytes! in the code
